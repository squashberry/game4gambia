<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline – Game4Gambia</title>
    <style>
      body {
        background: #050505;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #a3e635;
        color: #0a0a0a;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 20px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #a1a1aa;
        font-size: 0.875rem;
        max-width: 300px;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        background: #a3e635;
        color: #0a0a0a;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="badge">G4</div>
    <h1>You’re offline</h1>
    <p>Check your internet connection and try again. Some pages may be available from cache.</p>
